<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Hand Tracking Music Looper - UI Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f0f15; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    /* Mockup Frame */
    .app-container {
      width: 900px;
      height: 560px;
      background: #181925;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 2px #2d2f45;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Webcam View Simulation */
    .webcam-feed {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #25283b 0%, #11121a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .webcam-text { color: rgba(255,255,255,0.05); font-size: 48px; font-weight: 900; letter-spacing: 4px; }

    /* Top Bar Header */
    .top-bar {
      position: relative; z-index: 10;
      height: 60px; background: rgba(18, 19, 29, 0.85);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .rec-status { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 14px; font-weight: 600; }
    .rec-dot { width: 12px; height: 12px; background: #ff4757; border-radius: 50%; box-shadow: 0 0 10px #ff4757; animation: blink 1.5s infinite; }
    .bpm-badge { background: #2f3146; color: #a4b0be; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .btn-select { background: #2f3146; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }

    /* Interactive UI Area */
    .canvas-area { position: relative; z-index: 5; flex: 1; }

    /* Virtual Buttons */
    .v-btn {
      position: absolute; width: 90px; height: 90px; border-radius: 50%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; font-weight: bold; cursor: pointer; transition: all 0.2s ease;
      background: rgba(255,255,255,0.03); border: 2px solid;
    }
    .v-btn .label { font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .v-btn .sub { font-size: 10px; opacity: 0.7; margin-top: 2px; }

    /* Instrument Styles */
    .btn-drum { border-color: #ff4757; box-shadow: 0 0 15px rgba(255, 71, 87, 0.2); }
    .btn-bass { border-color: #70a1ff; box-shadow: 0 0 15px rgba(112, 161, 255, 0.2); }
    .btn-piano { border-color: #2ed573; box-shadow: 0 0 15px rgba(46, 213, 115, 0.2); }

    /* Active Hand-Touch State */
    .btn-piano.active {
      transform: scale(1.15);
      background: rgba(46, 213, 115, 0.3);
      box-shadow: 0 0 30px rgba(46, 213, 115, 0.8);
      border-color: #7bed9f;
    }

    /* Hand Tracking Skeleton Simulation */
    .hand-skeleton {
      position: absolute; top: 120px; right: 190px; z-index: 8; pointer-events: none;
    }
    .finger-tip {
      width: 18px; height: 18px; background: #fffa65; border-radius: 50%;
      box-shadow: 0 0 15px #fffa65; position: absolute; top: 18px; right: 88px;
    }

    /* Bottom Bar - Looper Tracks */
    .bottom-bar {
      position: relative; z-index: 10; height: 70px;
      background: rgba(18, 19, 29, 0.85); backdrop-filter: blur(10px);
      display: flex; align-items: center; padding: 0 24px; gap: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .track-card {
      flex: 1; background: #232533; height: 40px; border-radius: 8px;
      display: flex; align-items: center; padding: 0 12px; gap: 10px;
      border: 1px solid #33354a;
    }
    .track-progress { flex: 1; height: 6px; background: #181925; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Camera Background -->
    <div class="webcam-feed">
      <div class="webcam-text">WEBCAM LIVE FEED</div>
    </div>

    <!-- Header UI -->
    <div class="top-bar">
      <div class="rec-status">
        <div class="rec-dot"></div>
        <span>REC 00:04 / 00:16</span>
        <span class="bpm-badge">BPM: 120</span>
      </div>
      <button class="btn-select">เครื่องดนตรี ▾</button>
    </div>

    <!-- Interactive Canvas -->
    <div class="canvas-area">
      <!-- Drum Zone -->
      <div class="v-btn btn-drum" style="top: 40px; left: 80px;">
        <span class="label">KICK</span><span class="sub">กลอง</span>
      </div>
      <div class="v-btn btn-drum" style="top: 40px; left: 200px;">
        <span class="label">SNARE</span><span class="sub">กลอง</span>
      </div>

      <!-- Bass Zone -->
      <div class="v-btn btn-bass" style="top: 40px; right: 320px;">
        <span class="label">BASS C2</span><span class="sub">เบส</span>
      </div>

      <!-- Piano Zone (Touched by Finger) -->
      <div class="v-btn btn-piano active" style="top: 40px; right: 200px;">
        <span class="label">PIANO E4</span><span class="sub">เปียโน</span>
      </div>

      <!-- Hand Tracking Visualization -->
      <div class="hand-skeleton">
        <svg width="200" height="250">
          <path d="M 50 200 L 80 130 L 100 50" stroke="#00f2fe" stroke-width="3" stroke-dasharray="4" fill="none"/>
          <circle cx="50" cy="200" r="6" fill="#00f2fe"/>
          <circle cx="80" cy="130" r="6" fill="#00f2fe"/>
        </svg>
        <div class="finger-tip"></div>
      </div>
    </div>

    <!-- Footer UI (Tracks) -->
    <div class="bottom-bar">
      <div class="track-card">
        <span style="color:#ff4757; font-size:12px; font-weight:bold;">Track 1: Drums</span>
        <div class="track-progress"><div class="progress-fill" style="width: 75%; background: #ff4757;"></div></div>
      </div>
      <div class="track-card">
        <span style="color:#2ed573; font-size:12px; font-weight:bold;">Track 2: Piano</span>
        <div class="track-progress"><div class="progress-fill" style="width: 35%; background: #2ed573;"></div></div>
      </div>
    </div>
  </div>

</body>
</html>
